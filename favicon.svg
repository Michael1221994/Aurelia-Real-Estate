<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Luxury Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151922" />
      <stop offset="50%" stop-color="#0e1117" />
      <stop offset="100%" stop-color="#06080b" />
    </linearGradient>

    <!-- Warm Champagne Gold Gradient -->
    <linearGradient id="goldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#faefe3" />
      <stop offset="35%" stop-color="#dfc8a8" />
      <stop offset="70%" stop-color="#c5a880" />
      <stop offset="100%" stop-color="#93744c" />
    </linearGradient>

    <!-- Refined Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(223, 200, 168, 0.6)" />
      <stop offset="100%" stop-color="rgba(197, 168, 128, 0.15)" />
    </linearGradient>
  </defs>

  <!-- Squircle Canvas Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Inner Architectural Inset -->
  <rect x="34" y="34" width="444" height="444" rx="94" fill="none" stroke="rgba(197, 168, 128, 0.12)" stroke-width="1.5" />

  <!-- Geometric Architectural 'A' Monogram -->
  <!-- Left Pylon -->
  <polygon points="256,92 292,92 184,412 124,412" fill="url(#goldGrad)" />

  <!-- Right Pylon -->
  <polygon points="256,92 388,412 328,412 220,92" fill="url(#goldGrad)" />

  <!-- Cantilevered Horizon Beam -->
  <rect x="136" y="278" width="240" height="34" rx="6" fill="url(#goldGrad)" />

  <!-- Zenith Apex Diamond (Architectural Keystones) -->
  <polygon points="256,76 270,96 256,116 242,96" fill="#faefe3" />
</svg>
